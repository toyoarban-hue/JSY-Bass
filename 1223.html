<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ＪＳＹバス例会、オールスター 12/23 相模湖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      color: #222;
      max-width: 480px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: #0f4c81;
      color: white;
      padding: 12px 14px;
      text-align: center;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.05rem;
      line-height: 1.35;
      margin-bottom: 10px;
    }
    header h1 .title-sub {
      display: block;
      font-size: 0.92rem;
      font-weight: bold;
      margin-top: 2px;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background-color: #09355c;
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #b8d0e6;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #ffffff;
      color: #0f4c81;
    }

    .pages-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      flex: 1;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    .pages-container::-webkit-scrollbar {
      display: none;
    }

    .page {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 64px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }
    .section-heading {
      font-size: 0.95rem;
      font-weight: bold;
      color: #0f4c81;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      text-align: center;
      white-space: nowrap;
    }
    .section-heading.heading-long {
      font-size: 0.78rem;
      padding-left: 44px;
      padding-right: 44px;
    }
    .section-heading .refresh-btn {
      position: absolute;
      right: 0;
    }
    .refresh-btn {
      background: #e2e8f0;
      color: #0f4c81;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #444;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
      font-family: inherit;
      color: #222;
    }
    .form-group textarea {
      font-size: 0.92rem;
      resize: vertical;
      min-height: 70px;
    }
    .image-preview-container {
      margin-top: 10px;
      display: none;
      text-align: center;
    }
    .image-preview-container img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      object-fit: cover;
    }
    .compress-info {
      font-size: 0.78rem;
      color: #2b9348;
      margin-top: 6px;
      font-weight: bold;
    }
    .submit-btn {
      width: 100%;
      background-color: #e63946;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:disabled {
      background-color: #ccc;
    }

    .feed-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }
    .feed-card img {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      display: block;
      background: #e2e8f0;
    }
    .feed-body {
      padding: 12px 14px;
    }
    .feed-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .feed-angler {
      font-weight: bold;
      font-size: 1rem;
    }
    .feed-size {
      font-size: 1.2rem;
      font-weight: bold;
      color: #e63946;
    }
    .feed-comment {
      margin-top: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      border-left: 3px solid #0f4c81;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .feed-meta {
      font-size: 0.78rem;
      color: #666;
      margin-top: 6px;
    }

    .big-fish-card {
      background: linear-gradient(135deg, #0f4c81 0%, #1d70b8 100%);
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(15, 76, 129, 0.25);
    }
    .big-fish-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .big-fish-label {
      font-size: 0.78rem;
      opacity: 0.95;
      font-weight: bold;
    }
    .big-fish-time {
      font-size: 0.8rem;
      opacity: 0.95;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.18);
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .big-fish-content {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .big-fish-content img {
      width: 96px;
      height: 96px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.15);
    }
    .big-fish-info {
      flex: 1;
      min-width: 0;
    }
    .big-fish-record {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffd166;
      line-height: 1.2;
    }
    .big-fish-sub {
      font-size: 0.9rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .big-fish-comment {
      margin-top: 8px;
      padding: 7px 9px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ranking-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 10px;
    }
    .rank-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
      background: #e2e8f0;
      color: #333;
    }
    .rank-1 { background: #ffd700; color: #5a4b00; }
    .rank-2 { background: #c0c0c0; color: #333; }
    .rank-3 { background: #cd7f32; color: #fff; }

    .ranking-info { flex-grow: 1; min-width: 0; }
    .ranking-name { font-weight: bold; font-size: 0.95rem; }
    .ranking-detail {
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-top: 3px;
    }
    .ranking-total-wrap { text-align: right; flex-shrink: 0; margin-left: 8px; }
    .ranking-total-label { font-size: 0.65rem; color: #666; display: block; }
    .ranking-total-num { font-size: 1.15rem; font-weight: bold; color: #0f4c81; }

    .empty-msg {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .lock-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 12px;
    }
    .lock-title {
      font-size: 1rem;
      font-weight: bold;
      color: #0f4c81;
      margin-bottom: 8px;
    }
    .lock-desc {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .lock-form {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .lock-input {
      width: 140px;
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: center;
    }
    .lock-btn {
      background: #0f4c81;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .lock-error {
      color: #e63946;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ＪＳＹバス例会、オールスター<span class="title-sub">12/23 相模湖</span></h1>
    <div class="tab-bar">
      <button class="tab-btn active" data-index="0">① 投稿</button>
      <button class="tab-btn" data-index="1">② フィード</button>
      <button class="tab-btn" data-index="2">③ 順位・最大</button>
    </div>
  </header>

  <div class="pages-container" id="pagesContainer">

    <!-- ① 投稿専用画面 -->
    <section class="page" id="page-post">
      <div class="section-heading">釣果の検量投稿</div>
      <div class="card">
        <form id="postForm">
          <div class="form-group">
            <label for="anglerName">参加者名</label>
            <select id="anglerName" required>
              <option value="">選択してください</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fishLength">サイズ(30cm以上、小数点以下切り捨て）</label>
            <input type="number" id="fishLength" min="30" step="any" placeholder="例：45" required>
          </div>

          <div class="form-group">
            <label for="fishComment">コメント（ヒットルアー・リグ・ポイント・水深等）</label>
            <textarea id="fishComment" placeholder="例：スピナーベイト / テキサスリグ / シャローのカバー / 水深1.5m"></textarea>
          </div>

          <div class="form-group">
            <label for="photoInput">検量写真（自動で軽量化されます）</label>
            <input type="file" id="photoInput" accept="image/*" required>
            <div class="image-preview-container" id="previewContainer">
              <img id="imagePreview" src="" alt="プレビュー">
              <div class="compress-info" id="compressInfo"></div>
            </div>
          </div>

          <button type="button" class="submit-btn" id="submitBtn">検量を送信する</button>
        </form>
      </div>
    </section>

    <!-- ② タイムフィード画面 -->
    <section class="page" id="page-feed">
      <div class="section-heading">
        <span>リアルタイムフィード</span>
        <button type="button" class="refresh-btn" id="refreshFeedBtn">更新</button>
      </div>
      <div id="feedList">
        <div class="empty-msg">読み込み中...</div>
      </div>
    </section>

    <!-- ③ 順位表＋現時点の最大魚 -->
    <section class="page" id="page-ranking">
      <div class="section-heading heading-long">
        <span>現時点の最大魚（シングルレコード）</span>
        <button type="button" class="refresh-btn" id="refreshRankBtn">更新</button>
      </div>
      <div id="bigFishArea">
        <div class="empty-msg">読み込み中...</div>
      </div>

      <div class="section-heading" style="margin-top: 16px;">3匹合計 全体順位（全投稿反映）</div>
      <div id="rankingList">
        <div class="empty-msg">読み込み中...</div>
      </div>
    </section>

  </div>
