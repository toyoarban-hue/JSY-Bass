<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ＪＳＹバス例会、オールスター 12/23 相模湖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      color: #222;
      max-width: 480px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: #0f4c81;
      color: white;
      padding: 12px 14px;
      text-align: center;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.05rem;
      line-height: 1.35;
      margin-bottom: 10px;
    }
    header h1 .title-sub {
      display: block;
      font-size: 0.92rem;
      font-weight: bold;
      margin-top: 2px;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background-color: #09355c;
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #b8d0e6;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #ffffff;
      color: #0f4c81;
    }

    .pages-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      flex: 1;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    .pages-container::-webkit-scrollbar {
      display: none;
    }

    .page {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 64px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }
    .section-heading {
      font-size: 0.95rem;
      font-weight: bold;
      color: #0f4c81;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      text-align: center;
      white-space: nowrap;
    }
    .section-heading.heading-long {
      font-size: 0.78rem;
      padding-left: 44px;
      padding-right: 44px;
    }
    .section-heading .refresh-btn {
      position: absolute;
      right: 0;
    }
    .refresh-btn {
      background: #e2e8f0;
      color: #0f4c81;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #444;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
      font-family: inherit;
      color: #222;
    }
    .form-group textarea {
      font-size: 0.92rem;
      resize: vertical;
      min-height: 70px;
    }
    .image-preview-container {
      margin-top: 10px;
      display: none;
      text-align: center;
    }
    .image-preview-container img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      object-fit: cover;
    }
    .compress-info {
      font-size: 0.78rem;
      color: #2b9348;
      margin-top: 6px;
      font-weight: bold;
    }
    .submit-btn {
      width: 100%;
      background-color: #e63946;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:disabled {
      background-color: #ccc;
    }

    .feed-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }
    .feed-card img {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      display: block;
      background: #e2e8f0;
    }
    .feed-body {
      padding: 12px 14px;
    }
    .feed-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .feed-angler {
      font-weight: bold;
      font-size: 1rem;
    }
    .feed-size {
      font-size: 1.2rem;
      font-weight: bold;
      color: #e63946;
    }
    .feed-comment {
      margin-top: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      border-left: 3px solid #0f4c81;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .feed-meta {
      font-size: 0.78rem;
      color: #666;
      margin-top: 6px;
    }

    .big-fish-card {
      background: linear-gradient(135deg, #0f4c81 0%, #1d70b8 100%);
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(15, 76, 129, 0.25);
    }
    .big-fish-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .big-fish-label {
      font-size: 0.78rem;
      opacity: 0.95;
      font-weight: bold;
    }
    .big-fish-time {
      font-size: 0.8rem;
      opacity: 0.95;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.18);
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .big-fish-content {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .big-fish-content img {
      width: 96px;
      height: 96px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.15);
    }
    .big-fish-info {
      flex: 1;
      min-width: 0;
    }
    .big-fish-record {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffd166;
      line-height: 1.2;
    }
    .big-fish-sub {
      font-size: 0.9rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .big-fish-comment {
      margin-top: 8px;
      padding: 7px 9px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ranking-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 10px;
    }
    .rank-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
      background: #e2e8f0;
      color: #333;
    }
    .rank-1 { background: #ffd700; color: #5a4b00; }
    .rank-2 { background: #c0c0c0; color: #333; }
    .rank-3 { background: #cd7f32; color: #fff; }

    .ranking-info { flex-grow: 1; min-width: 0; }
    .ranking-name { font-weight: bold; font-size: 0.95rem; }
    .ranking-detail {
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-top: 3px;
    }
    .ranking-total-wrap { text-align: right; flex-shrink: 0; margin-left: 8px; }
    .ranking-total-label { font-size: 0.65rem; color: #666; display: block; }
    .ranking-total-num { font-size: 1.15rem; font-weight: bold; color: #0f4c81; }

    .empty-msg {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .lock-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 12px;
    }
    .lock-title {
      font-size: 1rem;
      font-weight: bold;
      color: #0f4c81;
      margin-bottom: 8px;
    }
    .lock-desc {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .lock-form {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .lock-input {
      width: 140px;
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: center;
    }
    .lock-btn {
      background: #0f4c81;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .lock-error {
      color: #e63946;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ＪＳＹバス例会、オールスター<span class="title-sub">12/23 相模湖</span></h1>
    <div class="tab-bar">
      <button type="button" class="tab-btn active" data-index="0">① 投稿</button>
      <button type="button" class="tab-btn" data-index="1">② フィード</button>
      <button type="button" class="tab-btn" data-index="2">③ 順位・最大</button>
    </div>
  </header>

  <div class="pages-container" id="pagesContainer">

    <!-- ① 投稿専用画面 -->
    <section class="page" id="page-post">
      <div class="section-heading">釣果の検量投稿</div>
      <div class="card">
        <form id="postForm">
          <div class="form-group">
            <label for="anglerName">参加者名</label>
            <select id="anglerName" required>
              <option value="">選択してください</option>
              <option value="吉岡 (新つくば店)">吉岡 (新つくば店)</option>
              <option value="佐藤 (本社)">佐藤 (本社)</option>
              <option value="森田 (市原店)">森田 (市原店)</option>
              <option value="西 (奥戸店)">西 (奥戸店)</option>
              <option value="大室(鴻巣店)">大室(鴻巣店)</option>
              <option value="小林 (つきみ野店)">小林 (つきみ野店)</option>
              <option value="林 (木更津店)">林 (木更津店)</option>
              <option value="芝 (木更津店)">芝 (木更津店)</option>
              <option value="大澤 (市原店)">大澤 (市原店)</option>
              <option value="錦織 (美浜店)">錦織 (美浜店)</option>
              <option value="錦織 妻">錦織 妻</option>
              <option value="染谷 (OB)">染谷 (OB)</option>
              <option value="OSP折金プロ">OSP折金プロ</option>
              <option value="OSP岡田さん">OSP岡田さん</option>
              <option value="井上 (圏央厚木店)">井上 (圏央厚木店)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fishLength">サイズ(30cm以上、小数点以下切り捨て）</label>
            <input type="number" id="fishLength" min="30" step="any" placeholder="例：45" required>
          </div>

          <div class="form-group">
            <label for="fishComment">コメント（ヒットルアー・リグ・ポイント・水深等）</label>
            <textarea id="fishComment" placeholder="例：スピナーベイト / テキサスリグ / シャローのカバー / 水深1.5m"></textarea>
          </div>

          <div class="form-group">
            <label for="photoInput">検量写真（自動で軽量化されます）</label>
            <input type="file" id="photoInput" accept="image/*" required>
            <div class="image-preview-container" id="previewContainer">
              <img id="imagePreview" src="" alt="プレビュー">
              <div class="compress-info" id="compressInfo"></div>
            </div>
          </div>

          <button type="button" class="submit-btn" id="submitBtn">検量を送信する</button>
        </form>
      </div>
    </section>

    <!-- ② タイムフィード画面 -->
    <section class="page" id="page-feed">
      <div class="section-heading">
        <span>リアルタイムフィード</span>
        <button type="button" class="refresh-btn" id="refreshFeedBtn">更新</button>
      </div>
      <div id="feedList">
        <div class="empty-msg">読み込み中...</div>
      </div>
    </section>

    <!-- ③ 順位表＋現時点の最大魚 -->
    <section class="page" id="page-ranking">
      <div class="section-heading heading-long">
        <span>現時点の最大魚（シングルレコード）</span>
        <button type="button" class="refresh-btn" id="refreshRankBtn">更新</button>
      </div>
      <div id="bigFishArea">
        <div class="empty-msg">読み込み中...</div>
      </div>

      <div class="section-heading" style="margin-top: 16px;">3匹合計 全体順位（全投稿反映）</div>
      <div id="rankingList">
        <div class="empty-msg">読み込み中...</div>
      </div>
    </section>

  </div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxOoHBCpGsrnDYF7FFx2Lopgu-rDwtECyiW9dOe7EmJa3ugQpLZ0sNNxSnrfy37hhEh/exec';

    const LOCK_START_MINUTES = 12 * 60;
    const LOCK_END_MINUTES = 14 * 60;
    const ADMIN_PASSCODE = '1223';
    let isAdminUnlocked = sessionStorage.getItem('jsy_1223_admin_unlocked') === '1';
    let latestPosts = [];
    let feedLockError = '';
    let rankLockError = '';

    const pagesContainer = document.getElementById('pagesContainer');
    const tabBtns = document.querySelectorAll('.tab-btn');

    function setActiveTab(index) {
      tabBtns.forEach((btn, idx) => {
        btn.classList.toggle('active', idx === index);
      });
    }

    tabBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const index = Number(btn.dataset.index);
        setActiveTab(index);
        pagesContainer.scrollTo({
          left: pagesContainer.clientWidth * index,
          behavior: 'smooth'
        });
      });
    });

    pagesContainer.addEventListener('scroll', () => {
      if (!pagesContainer.clientWidth) return;
      const currentIndex = Math.round(pagesContainer.scrollLeft / pagesContainer.clientWidth);
      setActiveTab(currentIndex);
    });

    const photoInput = document.getElementById('photoInput');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const compressInfo = document.getElementById('compressInfo');
    let compressedImageBase64 = '';

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const originalSizeMB = (file.size / (1024 * 1024)).toFixed(2);
      const reader = new FileReader();

      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const maxDimension = 1000;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDimension) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            }
          } else {
            if (height > maxDimension) {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.75);
          const compressedSizeKB = ((compressedImageBase64.length * 3) / 4 / 1024).toFixed(1);

          imagePreview.src = compressedImageBase64;
          compressInfo.innerHTML = '軽量化完了: ' + originalSizeMB + ' MB ➔ <b>' + compressedSizeKB + ' KB</b>';
          previewContainer.style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function floorSize(val) {
      const num = Number(val);
      if (isNaN(num)) return 0;
      return Math.floor(num);
    }

    function formatTimeAgo(isoString) {
      const date = new Date(isoString);
      if (isNaN(date.getTime())) return isoString;
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return hours + ':' + minutes;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isSecretTimeWindow() {
      const now = new Date();
      const minutes = now.getHours() * 60 + now.getMinutes();
      return minutes >= LOCK_START_MINUTES && minutes < LOCK_END_MINUTES;
    }

    function canViewSecretContent() {
      return !isSecretTimeWindow() || isAdminUnlocked;
    }

    function renderLockBox(targetId, errorMsg) {
      const target = document.getElementById(targetId);
      const errHtml = errorMsg ? '<div class="lock-error">' + escapeHtml(errorMsg) + '</div>' : '';
      target.innerHTML =
        '<div class="lock-card">' +
          '<div class="lock-title">🔒 12:00〜14:00 シークレットタイム</div>' +
          '<div class="lock-desc">結果発表までの間、フィードと順位表は非表示です（投稿は引き続き可能です）。<br>14:00以降に再度全員閲覧可能になります。</div>' +
          '<div class="lock-form">' +
            '<input type="password" class="lock-input" data-role="admin-pass" placeholder="管理者パス">' +
            '<button type="button" class="lock-btn" data-role="admin-unlock">解除</button>' +
          '</div>' +
          errHtml +
        '</div>';
    }

    function bindLockEvents() {
      document.querySelectorAll('[data-role="admin-unlock"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.lock-card');
          const input = card ? card.querySelector('[data-role="admin-pass"]') : null;
          const entered = input ? input.value.trim() : '';

          if (entered === ADMIN_PASSCODE) {
            isAdminUnlocked = true;
            sessionStorage.setItem('jsy_1223_admin_unlocked', '1');
            feedLockError = '';
            rankLockError = '';
            renderFeed(latestPosts);
            renderRanking(latestPosts);
          } else {
            feedLockError = 'パスワードが違います。';
            rankLockError = 'パスワードが違います。';
            renderFeed(latestPosts);
            renderRanking(latestPosts);
          }
        });
      });
    }

    function renderFeed(posts) {
      const feedList = document.getElementById('feedList');

      if (!canViewSecretContent()) {
        renderLockBox('feedList', feedLockError);
        bindLockEvents();
        return;
      }

      if (!posts || posts.length === 0) {
        feedList.innerHTML = '<div class="empty-msg">まだ釣果の投稿がありません。</div>';
        return;
      }

      const newestFirst = [...posts].reverse();
      feedList.innerHTML = newestFirst.map(post => {
        const sizeVal = floorSize(post.fishLength);
        const commentHtml = post.comment
          ? '<div class="feed-comment">' + escapeHtml(post.comment) + '</div>'
          : '';
        return (
          '<div class="feed-card">' +
            '<img src="' + escapeHtml(post.imageUrl) + '" alt="釣果写真" loading="lazy">' +
            '<div class="feed-body">' +
              '<div class="feed-top">' +
                '<span class="feed-angler">' + escapeHtml(post.anglerName) + '</span>' +
                '<span class="feed-size">' + sizeVal + ' cm</span>' +
              '</div>' +
              commentHtml +
              '<div class="feed-meta">' + formatTimeAgo(post.timestamp) + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    function renderRanking(posts) {
      const bigFishArea = document.getElementById('bigFishArea');
      const rankingList = document.getElementById('rankingList');

      if (!canViewSecretContent()) {
        renderLockBox('bigFishArea', rankLockError);
        rankingList.innerHTML = '<div class="empty-msg">🔒 12:00〜14:00 は順位表を非表示中です。</div>';
        bindLockEvents();
        return;
      }

      if (!posts || posts.length === 0) {
        bigFishArea.innerHTML = '<div class="empty-msg">まだ記録がありません。</div>';
        rankingList.innerHTML = '<div class="empty-msg">まだ順位データがありません。</div>';
        return;
      }

      const maxSize = Math.max(...posts.map(p => floorSize(p.fishLength)));
      const bigFishList = posts.filter(p => floorSize(p.fishLength) === maxSize);
      const isTie = bigFishList.length > 1;

      bigFishArea.innerHTML = bigFishList.map((fish) => {
        const fishSize = floorSize(fish.fishLength);
        const fishTime = formatTimeAgo(fish.timestamp);
        const labelText = isTie ? ('BIG ONE タイ記録（' + bigFishList.length + '名）') : 'BIG ONE AWARD';
        const commentHtml = fish.comment
          ? '<div class="big-fish-comment">' + escapeHtml(fish.comment) + '</div>'
          : '';

        return (
          '<div class="big-fish-card">' +
            '<div class="big-fish-header">' +
              '<span class="big-fish-label">' + escapeHtml(labelText) + '</span>' +
              '<span class="big-fish-time">' + escapeHtml(fishTime) + '</span>' +
            '</div>' +
            '<div class="big-fish-content">' +
              '<img src="' + escapeHtml(fish.imageUrl) + '" alt="最大魚">' +
